<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tecnológica OT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      margin: 0;
      padding: 15px;
    }

    .contenedor {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #0d47a1;
      margin-top: 10px;
    }

    .tarjeta {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      color: #333;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      height: 90px;
      resize: vertical;
    }

    #firma {
      width: 100%;
      height: 220px;
      border: 2px dashed #0d47a1;
      border-radius: 10px;
      background: white;
      touch-action: none;
      display: block;
    }

    .botones-firma {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .boton-limpiar {
      background: #757575;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      background: #0d47a1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
    }

    .registro {
      background: white;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .registro h3 {
      margin: 0 0 5px 0;
      color: #0d47a1;
    }

    .registro p {
      margin: 4px 0;
      color: #444;
      word-wrap: break-word;
    }

    .numero {
      font-size: 18px;
      font-weight: bold;
      color: #0d47a1;
    }

    .firma-guardada {
      width: 100%;
      max-width: 320px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
    }

    .eliminar {
      background: #d32f2f;
      margin-top: 8px;
      padding: 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="contenedor">
    <h1>Tecnológica OT</h1>

    <div class="tarjeta">
      <label>Fecha</label>
      <input type="date" id="fecha">

      <label>Nombre Cliente</label>
      <input type="text" id="cliente" placeholder="Nombre del cliente">

      <label>Nombre Contacto</label>
      <input type="text" id="contacto" placeholder="Nombre de la persona de contacto">

      <label>Materiales utilizados</label>
      <textarea id="materiales" placeholder="Ejemplo: cable, conectores, tornillos..."></textarea>

      <label>Descripción tarea</label>
      <textarea id="descripcion" placeholder="Describe el trabajo realizado"></textarea>

      <label>Observaciones</label>
      <textarea id="observaciones" placeholder="Observaciones adicionales"></textarea>

      <label>Firma digital</label>
      <canvas id="firma"></canvas>

      <div class="botones-firma">
        <button class="boton-limpiar" onclick="limpiarFirma()">Limpiar firma</button>
      </div>

      <button onclick="guardar()">Guardar OT</button>
    </div>

    <h2>Órdenes guardadas</h2>
    <div id="lista"></div>
  </div>

  <script>
    let db;
    let dibujando = false;
    let ultimaPosicion = null;

    const canvas = document.getElementById("firma");
    const ctx = canvas.getContext("2d");

    function ajustarCanvas() {
      const ancho = canvas.clientWidth;
      const alto = canvas.clientHeight;

      const imagenActual = canvas.toDataURL();

      canvas.width = ancho;
      canvas.height = alto;

      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#000000";

      const imagen = new Image();
      imagen.onload = function() {
        ctx.drawImage(imagen, 0, 0);
      };
      imagen.src = imagenActual;
    }

    window.addEventListener("resize", ajustarCanvas);

    function obtenerPosicion(evento) {
      const rectangulo = canvas.getBoundingClientRect();

      return {
        x: evento.clientX - rectangulo.left,
        y: evento.clientY - rectangulo.top
      };
    }

    canvas.addEventListener("pointerdown", function(evento) {
      evento.preventDefault();
      dibujando = true;
      ultimaPosicion = obtenerPosicion(evento);
      canvas.setPointerCapture(evento.pointerId);
    });

    canvas.addEventListener("pointermove", function(evento) {
      if (!dibujando) return;

      evento.preventDefault();

      const posicion = obtenerPosicion(evento);

      ctx.beginPath();
      ctx.moveTo(ultimaPosicion.x, ultimaPosicion.y);
      ctx.lineTo(posicion.x, posicion.y);
      ctx.stroke();

      ultimaPosicion = posicion;
    });

    canvas.addEventListener("pointerup", function() {
      dibujando = false;
      ultimaPosicion = null;
    });

    canvas.addEventListener("pointercancel", function() {
      dibujando = false;
      ultimaPosicion = null;
    });

    function limpiarFirma() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    const peticion = indexedDB.open("TecnologicaOT", 2);

    peticion.onupgradeneeded = function(evento) {
      db = evento.target.result;

      if (!db.objectStoreNames.contains("ordenes")) {
        db.createObjectStore("ordenes", {
          keyPath: "id",
          autoIncrement: true
        });
      }
    };

    peticion.onsuccess = function(evento) {
      db = evento.target.result;
      ajustarCanvas();
      mostrar();
    };

    function guardar() {
      const fecha = document.getElementById("fecha").value;
      const cliente = document.getElementById("cliente").value;
      const contacto = document.getElementById("contacto").value;
      const materiales = document.getElementById("materiales").value;
      const descripcion = document.getElementById("descripcion").value;
      const observaciones = document.getElementById("observaciones").value;

      const firma = canvas.toDataURL("image/png");

      if (fecha === "" || cliente === "") {
        alert("Debes completar al menos la fecha y el nombre del cliente.");
        return;
      }

      const transaccion = db.transaction("ordenes", "readwrite");
      const almacen = transaccion.objectStore("ordenes");

      almacen.add({
        fecha: fecha,
        cliente: cliente,
        contacto: contacto,
        materiales: materiales,
        descripcion: descripcion,
        observaciones: observaciones,
        firma: firma
      });

      transaccion.oncomplete = function() {
        document.getElementById("fecha").value = "";
        document.getElementById("cliente").value = "";
        document.getElementById("contacto").value = "";
        document.getElementById("materiales").value = "";
        document.getElementById("descripcion").value = "";
        document.getElementById("observaciones").value = "";

        limpiarFirma();
        mostrar();
      };
    }

    function mostrar() {
      const transaccion = db.transaction("ordenes", "readonly");
      const pedido = transaccion.objectStore("ordenes").getAll();

      pedido.onsuccess = function() {
        const lista = document.getElementById("lista");
        lista.innerHTML = "";

        const ordenes = pedido.result;

        for (let i = 0; i < ordenes.length; i++) {
          const o = ordenes[i];
          const numeroOT = "OT-" + String(o.id).padStart(3, "0");

          lista.innerHTML += `
            <div class="registro">
              <p class="numero">${numeroOT}</p>
              <h3>${o.cliente}</h3>
              <p><b>Fecha:</b> ${o.fecha}</p>
              <p><b>Contacto:</b> ${o.contacto}</p>
              <p><b>Materiales:</b> ${o.materiales}</p>
              <p><b>Descripción:</b> ${o.descripcion}</p>
              <p><b>Observaciones:</b> ${o.observaciones}</p>
              <p><b>Firma:</b></p>
              <img class="firma-guardada" src="${o.firma}">
              <button class="eliminar" onclick="eliminar(${o.id})">Eliminar</button>
            </div>
          `;
        }

        if (ordenes.length === 0) {
          lista.innerHTML = "<p>No hay órdenes guardadas todavía.</p>";
        }
      };
    }

    function eliminar(id) {
      const transaccion = db.transaction("ordenes", "readwrite");
      transaccion.objectStore("ordenes").delete(id);

      transaccion.oncomplete = function() {
        mostrar();
      };
    }
  </script>
</body>
</html>
