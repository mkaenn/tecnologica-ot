<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi primera app</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f2f4f7;
    }

    input {
      width: 70%;
      padding: 12px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      background: #1e88e5;
      color: white;
      border: none;
      border-radius: 6px;
    }

    li {
      background: white;
      padding: 12px;
      margin-top: 8px;
      border-radius: 6px;
      list-style: none;
    }
  </style>
</head>

<body>
  <h1>Mis tareas</h1>

  <input id="tarea" placeholder="Escribe algo...">
  <button onclick="agregar()">Agregar</button>

  <ul id="lista"></ul>

  <script>
    let db;

    const peticion = indexedDB.open("MisTareas", 1);

    peticion.onupgradeneeded = function(evento) {
      db = evento.target.result;
      db.createObjectStore("tareas", {
        keyPath: "id",
        autoIncrement: true
      });
    };

    peticion.onsuccess = function(evento) {
      db = evento.target.result;
      mostrar();
    };

    function agregar() {
      const texto = document.getElementById("tarea").value;

      if (texto === "") {
        alert("Escribe una tarea primero");
        return;
      }

      const transaccion = db.transaction("tareas", "readwrite");
      transaccion.objectStore("tareas").add({
        texto: texto,
        fecha: new Date().toLocaleString()
      });

      transaccion.oncomplete = function() {
        document.getElementById("tarea").value = "";
        mostrar();
      };
    }

    function mostrar() {
      const transaccion = db.transaction("tareas", "readonly");
      const pedido = transaccion.objectStore("tareas").getAll();

      pedido.onsuccess = function() {
        let html = "";

        for (let i = 0; i < pedido.result.length; i++) {
          html += "<li>" + pedido.result[i].texto + "</li>";
        }

        document.getElementById("lista").innerHTML = html;
      };
    }
  </script>
</body>
</html>
